<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Autentificare</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f2f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 2em 3em;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 1em;
        }
        input {
            width: 100%;
            padding: 0.7em;
            margin-top: 0.2em;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 1.5em;
            padding: 0.7em;
            background: #64b5f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .error {
            color: red;
            margin-top: 1em;
            text-align: center;
        }
        .info {
            color: #555;
            margin-top: 1em;
            text-align: center;
        }
        .register-link {
            margin-top: 1em;
            text-align: center;
        }
        a {
            color: #64b5f6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Autentificare</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if next %}
        <p class="info">Te rugăm să te autentifici pentru a continua.</p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="next" value="{{ next or '' }}">
        
        <label for="username">Username:</label>
        <input type="text" name="username" required>

        <label for="password">Parolă:</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        <p>Nu ai cont? <a href="/register">Înregistrează-te</a></p>
    </div>
</div>
</body>
</html>
