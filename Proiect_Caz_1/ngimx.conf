worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    log_format main_with_upstream '$remote_addr - $remote_user [$time_local] "$request" '
                                  '$status $body_bytes_sent "$http_referer" '
                                  '"$http_user_agent" "$http_x_forwarded_for" '
                                  '"$upstream_addr"';

    # --- START MODIFICARE ---
    # Acum, blocul upstream conține adresele IP ale celor două servere Flask.
    # Nginx va distribui automat cererile între ele.
    upstream flask_backend {
        server 192.168.50.1:5000;   # Serverul Flask de pe Host PC
        server 192.168.50.3:5001;   # Serverul Flask de pe VM (presupunând că IP-ul VM-ului este .3)
    }
    # --- FINAL MODIFICARE ---

    upstream iis_backend {
        server 192.168.50.3:80;  # Serverul IIS de pe VM
    }

    server {
        listen 8080;

        access_log logs/access.log main_with_upstream;
        error_log logs/error.log;

        # Regula pentru fișiere statice trimite la IIS
        location ~ ^/(static|css|js|images)/ {
            proxy_pass http://iis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Regula pentru aplicație trimite acum la grupul de servere Flask
        location / {
            proxy_read_timeout 300s;
            proxy_pass http://flask_backend; # Nginx știe că 'flask_backend' are mai multe servere
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Backend-Server $proxy_host;
        }
    }
}