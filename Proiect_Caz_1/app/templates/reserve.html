<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Rezervare Cameră</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_reserve.css') }}">

</head>
<body>

<nav>
    <div class="nav-left">
        <h2>Platformă de rezervări</h2>
    </div>
    <div class="nav-right">
        <a href="/">Înapoi la Home</a>
        {% if logged_in %}
            <a href="/profile">Profil</a>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    <h2>Rezervă: {{ room.name }}</h2>
    <p><strong>Proprietate:</strong> {{ room.property_name }}</p>
    <p><strong>Capacitate:</strong> {{ room.capacity }} persoane</p>
    <p><strong>Preț:</strong> {{ room.price }} lei/noapte</p>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <label for="date_range"><strong>Selectează perioada:</strong></label>
        <input type="text" id="date_range" name="date_range" required readonly placeholder="YYYY-MM-DD to YYYY-MM-DD">
        <button type="submit">Confirmă rezervarea</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>
<script>
    const disabledDates = {{ disabled_dates | tojson }};
    new Litepicker({
        element: document.getElementById('date_range'),
        singleMode: false,
        format: 'YYYY-MM-DD',
        delimiter: ' to ',
        numberOfMonths: 2,
        numberOfColumns: 2,
        lang: 'ro',
        lockDays: disabledDates
    });
</script>
<script>
    window.addEventListener('beforeunload', function () {
        const flashMessages = document.querySelectorAll('.flash-message');
        flashMessages.forEach(function(message) {
            message.style.display = 'none';
        });
    });
</script>
</body>
</html>
