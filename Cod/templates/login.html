<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Autentificare</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: #f2f6f9;
        }
        
        .container {
            max-width: 450px;
            width: 100%;
            margin: 2em auto;
            background: white;
            padding: 2.5em;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 1em;
        }

        label {
            display: block;
            margin-top: 1em;
            margin-bottom: 0.3em;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.8em;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 1.5em;
            padding: 0.9em;
            background: #64b5f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover {
            background-color: #42a5f5;
        }

        .error {
            color: white;
            background-color: #ef5350;
            padding: 0.8em;
            border-radius: 6px;
            margin-top: 1em;
            text-align: center;
        }

        .info {
            color: #333;
            background-color: #ffcc80;
            padding: 0.8em;
            border-radius: 6px;
            margin-top: 1em;
            text-align: center;
        }

        .register-link {
            margin-top: 1.5em;
            text-align: center;
        }

        a {
            color: #64b5f6;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Autentificare</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if next %}
        <p class="info">Te rugăm să te autentifici pentru a continua.</p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="next" value="{{ next or '' }}">
        
        <label for="username">Nume utilizator:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Parolă:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        <p>Nu ai cont? <a href="/register">Înregistrează-te aici</a></p>
    </div>
</div>
</body>
</html>
