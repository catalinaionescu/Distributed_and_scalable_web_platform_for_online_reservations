<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Proprietate Nouă</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; font-family: 'Segoe UI', sans-serif; background: #f2f6f9; }
        nav { display: flex; justify-content: space-between; align-items: center; background-color: #dceefc; padding: 1em 2em; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-left h2 a { text-decoration: none; color: #333; }
        .nav-left h2 { margin: 0; font-size: 1.5em; }
        .nav-right { display: flex; align-items: center; gap: 10px; position: relative; }
        .nav-right a { background-color: #64b5f6; color: white; padding: 0.5em 1em; border-radius: 6px; text-decoration: none; font-size: 0.95em; white-space: nowrap; }
        .nav-right a:hover { background-color: #42a5f5; }
        .dropdown { position: relative; }
        .dropdown-menu { display: none; position: absolute; top: 2.8em; right: 0; background-color: white; border: 1px solid #ccc; border-radius: 6px; padding: 10px; min-width: 180px; z-index: 1000; }
        .dropdown-menu a { display: block; padding: 8px; margin: 5px 0; background-color: #f5f5f5; color: #333; text-decoration: none; border-radius: 4px; }
        .dropdown-menu a:hover { background-color: #e0e0e0; }
        .container { max-width: 900px; margin: 2em auto; background: white; padding: 2em; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input, select, button { width: 100%; padding: 0.8em; margin: 0.5em 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
        label { font-weight: bold; margin-top: 1em; display: block; }
        button { background: #81c784; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #66bb6a; }
        .room-type-group { border: 1px solid #e0e0e0; padding: 1.5em; border-radius: 8px; margin-bottom: 1.5em; background: #f9f9f9; }
        .room-type-group h4 { margin-top: 0; }
        .remove-btn { background-color: #ef5350 !important; }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <h2><a href="/">Platforma Rezervări</a></h2>
    </div>
    <div class="nav-right">
        {% if logged_in %}
            <a href="/add_property">Adaugă proprietate</a>
            <div class="dropdown">
                <a href="#" id="dropdownToggle">Profil ▼</a>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="/profile">Profil</a>
                    <a href="/my-reservations">Rezervările mele</a>
                    <a href="/my-properties">Cazările mele</a>
                    <a href="/edit-profile">Editează profilul</a>
                </div>
            </div>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    <h3>Adaugă o proprietate nouă</h3>
    <form method="post">
        <label>Numele proprietății:</label>
        <input type="text" name="name" placeholder="Ex: Pensiunea Soarelui" required>
        <label>Adresa:</label>
        <input type="text" name="address" placeholder="Ex: Str. Principală, Nr. 10" required>
        <label>Localitate:</label>
        <input type="text" name="city" placeholder="Ex: Brașov" required>
        <label>Țară:</label>
        <input type="text" name="country" placeholder="Ex: România" required>
        
        <hr style="margin: 2em 0;">
        <h3>Tipuri de camere:</h3>
        <div id="room-types-container">
            </div>
        <button type="button" id="add-room-type-btn" style="background-color: #64b5f6;">+ Adaugă un tip de cameră</button>
        <br><br>
        <button type="submit">Salvează proprietatea</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('dropdownToggle');
    if (toggle) {
        const menu = document.getElementById('dropdownMenu');
        toggle.addEventListener('click', function (e) {
            e.preventDefault();
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        });
        document.addEventListener('click', function (e) {
            if (menu && !toggle.contains(e.target) && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
        });
    }
    
    function addRoomType() {
        const container = document.getElementById('room-types-container');
        const index = container.children.length;
        const div = document.createElement('div');
        div.className = 'room-type-group';
        div.innerHTML = `
            <h4>Tip de cameră #${index + 1}</h4>
            <label>Nume tip (ex: Dublă Standard, Apartament Deluxe)</label>
            <input type="text" name="room_type_name[]" required>
            
            <label>Capacitate per cameră</label>
            <input type="number" name="capacity[]" min="1" required>
            
            <label>Preț/noapte per cameră</label>
            <input type="number" step="0.01" name="price[]" required>
            
            <label>Număr de camere de acest tip</label>
            <input type="number" name="room_count[]" min="1" value="1" required>
            
            <label>Disponibilitate generală</label>
            <select name="available[]">
                <option value="1">Disponibilă</option>
                <option value="0">Indisponibilă</option>
            </select>
            <button type="button" class="remove-btn">- Șterge acest tip</button>
        `;
        container.appendChild(div);
        div.querySelector('.remove-btn').addEventListener('click', function() {
            this.closest('.room-type-group').remove();
        });
    }
    document.getElementById('add-room-type-btn').addEventListener('click', addRoomType);
});
</script>

</body>
</html>
